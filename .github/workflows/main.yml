name: Build x86_64 Linux Distro

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt install build-essential binutils rsync wget libncurses-dev libelf-dev libssl-dev
      - name: Download Buildroot 2024.02
        run: |
         wget https://buildroot.org/downloads/buildroot-2025.02.3.tar.gz  
          tar -xf buildroot-2025.02.3.tar.gz  
           cd buildroot-2025.02.3

      - name: Copy Custom Configuration
        run: |
          mkdir -p buildroot_src/configs
          cp configs/my_x86_64_defconfig buildroot/configs/

      - name: Build Distribution
        run: |
          cd buildroot
          make my_x86_64_defconfig
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: x86_64-linux-images
          path: buildroot/output/images/
